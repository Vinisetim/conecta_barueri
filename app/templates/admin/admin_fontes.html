{% extends "base.html" %}

{% block title %}
Fontes de dados | Conecta Barueri
{% endblock %}

{% block extra_css %}

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/admin/fontes.css') }}"
>

{% endblock %}

{% block content %}

<section class="fontes-page">

    <div class="fontes-header">

        <div>

            <h1>Fontes de dados</h1>

            <p>
                Gerencie as fontes de dados conectadas
            </p>

        </div>

        <button
            id="btnNovaFonte"
            class="fontes-new-btn"
            type="button"
        >

            <i class="bi bi-plus-lg"></i>

            Nova fonte

        </button>

    </div>

    <section class="fontes-card">

        <div class="fontes-table-wrap">

            <table class="fontes-table">

                <thead>

                    <tr>

                        <th>Fonte de dados</th>

                        <th>Descrição</th>

                        <th>Status</th>

                        <th>Última sincronização</th>

                        <th>Ações</th>

                    </tr>

                </thead>

                <tbody id="fontesBody">

                    <!--
                    Conteúdo carregado
                    automaticamente pelo JS
                    -->

                </tbody>

            </table>

        </div>

        <!-- PAGINAÇÃO -->

<div class="fontes-pagination">

    <span class="fontes-pagination-info">
        1-6 de 24
    </span>

    <div class="fontes-pages">

        <a href="#">
            <i class="bi bi-chevron-left"></i>
        </a>

        <a href="#" class="active">
            1
        </a>

        <a href="#">
            2
        </a>

        <a href="#">
            3
        </a>

        <a href="#">
            4
        </a>

        <a href="#">
            <i class="bi bi-chevron-right"></i>
        </a>

    </div>

</div>
    </section>

</section>

<script
    src="{{ url_for('static', filename='js/fontes.js') }}"
></script>

{% endblock %}
