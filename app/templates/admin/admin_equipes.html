{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin/equipes.css') }}">
{% endblock %}

{% block title %}Administrador | Conecta Barueri{% endblock %}

{% block content %}


    <div class="parte-cima">
        <div>
            <h1>Equipes</h1>
            <p>Gerencie as equipes da plataforma</p>
        </div>

        <div class="bota-equipe">
            <button id="abrirmodal" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nova equipes</button>
          <dialog id="meuModal">
  <div class="modal-conteudo">

    <div class="modal-topo">
      <div>
        <h2>Nova equipe</h2>
        <p>Preencha os dados para criar uma nova equipe</p>
      </div>
      <button class="btn-fechar" id="fecharModal" aria-label="Fechar">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <form id="formEquipe" novalidate>

      <!-- Nome da equipe -->
      <div class="campo">
        <label for="nomeEquipe">Nome da equipe <span class="obrigatorio">*</span></label>
        <input
          type="text"
          id="nomeEquipe"
          placeholder="Ex: Equipe de Saúde Pública"
          required
        />
        <span class="erro-campo" id="erroNome"></span>
      </div>

      <!-- Módulo responsável -->
      <div class="campo">
        <label for="moduloEquipe">Módulo responsável <span class="obrigatorio">*</span></label>
        <select id="moduloEquipe" required>
          <option value="" disabled selected>Selecione um módulo</option>
          <option value="saude">Saúde</option>
          <option value="seguranca">Segurança</option>
          <option value="educacao">Educação</option>
          <option value="mobilidade">Mobilidade</option>
          <option value="meio-ambiente">Meio Ambiente</option>
          <option value="social">Assistência Social</option>
        </select>
        <span class="erro-campo" id="erroModulo"></span>
      </div>

      <!-- Descrição -->
      <div class="campo">
        <label for="descEquipe">Descrição</label>
        <textarea
          id="descEquipe"
          rows="3"
          placeholder="Descreva o objetivo desta equipe..."
        ></textarea>
      </div>

      <!-- Líder da equipe -->
      <div class="campo">
        <label for="liderEquipe">Líder da equipe</label>
        <input
          type="text"
          id="liderEquipe"
          placeholder="Nome do responsável"
        />
      </div>

      <!-- Membros -->
      <div class="campo">
        <label for="membrosEquipe">Membros <span class="dica">(separe por vírgula)</span></label>
        <input
          type="text"
          id="membrosEquipe"
          placeholder="Ex: Ana Lima, Carlos Silva, Maria Souza"
        />
      </div>

      <div class="modal-rodape">
        <button type="button" class="btn btn-outline-secondary" id="cancelarModal">
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-lg"></i> Criar equipe
        </button>
      </div>

    </form>
  </div>
</dialog>
        </div>
    </div>




       <div class="projeto" id="projectsGrid">


            <div class="projects-grid">
                  <!-- CARD 1 -->
                      <div class="project-card" data-status="published" data-title="Indicadores de Educação">
                        <div class="card-thumb saude">
                          <div class="thumb-mock">
                            <div style="display:flex;align-items:center;gap:12px;">
                              <div class="thumb-circle"></div>
                              <div class="thumb-chart">
                                <div class="thumb-bar" style="height:40px;"></div>
                                <div class="thumb-bar" style="height:55px;"></div>
                                <div class="thumb-bar" style="height:30px;"></div>
                                <div class="thumb-bar" style="height:48px;"></div>
                              </div>
                            </div>
                          </div>
                        </div>
                        <div class="card-body-proj">
                          <div class="card-creator">
                            <div class="creator-avatar" style="background:#0052ff;">UB</div>
                            <div class="creator-info">
                              <div class="creator-name">Uber</div>
                              <div class="creator-date"><i class="bi bi-calendar3" style="font-size:10px;"></i> Criado em 12 mai. 2026</div>
                            </div>
                          </div>
                        </div>
                      </div>

        </div><!-- /projects-grid -->

    </div>

     <script src="{{ url_for('static', filename='js/equipe.js') }}"></script>


{%endblock%}
