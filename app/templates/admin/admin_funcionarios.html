{% extends "base.html" %}

{% block title %}
Funcionários | Conecta Barueri
{% endblock %}

{% block extra_css %}
<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/admin/funcionarios.css') }}"
>
{% endblock %}

{% block content %}

<section class="funcionarios-page">

    <!-- CABEÇALHO -->
    <header class="funcionarios-header">

        <div>
            <h1>Funcionários</h1>
            <p>Gerencie os funcionários da plataforma</p>
        </div>

    </header>

    <!-- FILTROS -->
    <section class="funcionarios-filters">

        <div class="funcionarios-search">

            <i class="bi bi-search"></i>

            <input
                id="pesquisaFuncionario"
                type="text"
                placeholder="Pesquisar funcionário..."
            >

        </div>

        <select
            id="filtroPerfil"
            class="funcionarios-select"
        >
            <option>Todos os perfis</option>
            <option>Administrador</option>
            <option>Editor</option>
            <option>Visualizador</option>
        </select>

        <select
            id="filtroStatus"
            class="funcionarios-select"
        >
            <option>Todos os status</option>
            <option>Ativo</option>
            <option>Inativo</option>
        </select>

        <button
            id="btnAdicionar"
            class="funcionarios-add"
            type="button"
            aria-label="Adicionar funcionário"
        >
            <i class="bi bi-plus-lg"></i>
        </button>

    </section>

    <!-- TABELA -->
    <section class="funcionarios-card">

        <div class="funcionarios-table-wrap">

            <table class="funcionarios-table">

                <thead>

                    <tr>
                        <th>Funcionário</th>
                        <th>E-mail</th>
                        <th>Perfil</th>
                        <th>Equipe</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>

                </thead>

                <tbody id="funcionariosBody">

                    <!--
                    Os funcionários serão
                    carregados pelo JS
                    -->

                </tbody>

            </table>

        </div>

        <!-- PAGINAÇÃO -->

        <div class="funcionarios-pagination">

            <span>
                Funcionários cadastrados
            </span>

            <div class="fontes-pages">

                <a href="#">
                    <i class="bi bi-chevron-left"></i>
                </a>

                <a href="#" class="active">
                    1
                </a>

                <a href="#">
                    2
                </a>

                <a href="#">
                    3
                </a>

                <a href="#">
                    4
                </a>

                <a href="#">
                    <i class="bi bi-chevron-right"></i>
                </a>

            </div>

        </div>

    </section>

</section>

<script
    src="{{ url_for('static', filename='js/funcionarios.js') }}"
></script>

{% endblock %}
